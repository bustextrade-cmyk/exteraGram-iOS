name: Build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive, fetch-depth: 0}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: "15.4"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          cd build-system
          python3 Make/Make.py --cacheDir="$HOME/telegram-bazel-cache" generateProject --configurationPath=template_minimal_development_configuration.json --xcodeManagedCodesigning
      - run: |
          cd build-system
          python3 Make/Make.py --cacheDir="$HOME/telegram-bazel-cache" build --configurationPath=template_minimal_development_configuration.json --buildNumber=100001 --configuration=release_arm64
      - uses: actions/upload-artifact@v4
        with: {name: ipa, path: build/artifacts/*.ipa, if-no-files-found: warn}
